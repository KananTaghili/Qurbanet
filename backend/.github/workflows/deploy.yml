name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub Actions-a bizim kodları oxumaq icazəsi veririk
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Kodları serverə təhlükəsiz şəkildə kopyalayırıq (rsync ilə)
      - name: Copy files to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # və ya secrets.SSH_PRIVATE_KEY
          source: "./*"
          target: "/var/www/qurbanetbackend"
          rm: false # node_modules və .env silinməsin deyə false saxlayırıq

      # 3. Serverə qoşulub paketləri yazırıq və PM2-ni məcburi restart edirik
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Əgər hər hansı komanda xəta versə, deploy-u dayandır və mənə bildir
            set -e 
            
            cd /var/www/qurbanetbackend
            
            # Yeni paketləri yoxlayırıq
            npm install
            
            # PM2-ni mütləq şəkildə təzələyirik
            PORT=4000 pm2 restart qurbanetbackendpm --update-env \
              || PORT=4000 pm2 start server.js --name "qurbanetbackendpm"
            pm2 save
