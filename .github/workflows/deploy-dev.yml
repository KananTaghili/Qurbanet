name: Deploy FrontendDEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            set -e 
            
            cd /var/www/qurbanetfront-dev

            # Kodları GitHub-dan çəkirik (server-dəki local dəyişiklikləri ləğv edib təmiz çəkirik)
            git fetch origin dev
            git reset --hard origin/dev

            # Paketləri yeniləyirik
            npm install

            # Next.js production build edirik (Kritik addım)
            rm -rf .next
            npm install
            npm run build

            # Backend dependencies yeniləyirik
            cd /var/www/qurbanetfront-dev/backend
            npm install --omit=dev
            cd /var/www/qurbanetfront-dev

            # Backend PM2 prosesini restart edirik (sabit ad ilə — köhnə auto-detect
            # heuristikası uğursuz olanda backend köhnə kodla işləməyə davam edirdi,
            # amma job yenə "success" göstərirdi)
            if pm2 describe qurbanet-backend-dev > /dev/null 2>&1; then
              echo "Backend prosesi (qurbanet-backend-dev) tapıldı — restart edilir..."
              pm2 restart qurbanet-backend-dev --update-env
            else
              echo "Backend prosesi tapılmadı — yenidən başladılır..."
              cd /var/www/qurbanetfront-dev/backend
              pm2 start server.js --name qurbanet-backend-dev --update-env
              cd /var/www/qurbanetfront-dev
            fi

            # PM2 ilə tətbiqi sıfır itki ilə (zero-downtime) restart edirik
            PORT=3001 pm2 restart qurbanetfrontpm-dev --update-env
            pm2 save

            echo "🚀 Frontend DEV mühiti 100% uğurla yeniləndi!"